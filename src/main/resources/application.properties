spring.application.name=spring-boot-task-management-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tasks_demo;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
